<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="t">
  <title id="t">RankZap</title>
  <defs>
    <radialGradient id="g" cx="36%" cy="30%" r="82%">
      <stop offset="0" stop-color="#9F7AFA"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#7A3FF0"/>
    </radialGradient>
  </defs>
  <!-- Zappy: a tall blob that leans right; the eyes sit high on the right
       and the right eye is the smaller one, as in the approved artwork. -->
