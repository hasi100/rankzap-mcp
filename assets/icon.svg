  <g class="eyes" fill="#0A0A0C">
    <g transform="rotate(-12 154 108)">
      <rect class="eye" x="143" y="78" width="22" height="60" rx="11">
        <animate attributeName="height" values="60;60;6;60;60;60;60;60" keyTimes="0;0.44;0.47;0.5;0.52;0.7;0.73;1" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="y" values="78;78;105;78;78;78;78;78" keyTimes="0;0.44;0.47;0.5;0.52;0.7;0.73;1" dur="6s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g transform="rotate(-12 198 96)">
      <rect class="eye" x="189" y="72" width="18" height="48" rx="9">
        <animate attributeName="height" values="48;48;5;48;48;48;48;48" keyTimes="0;0.44;0.47;0.5;0.52;0.7;0.73;1" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="y" values="72;72;94;72;72;72;72;72" keyTimes="0;0.44;0.47;0.5;0.52;0.7;0.73;1" dur="6s" repeatCount="indefinite"/>
      </rect>
    </g>
